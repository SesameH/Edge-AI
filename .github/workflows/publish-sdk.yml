name: Publish SDK

# Builds prebuilt native libraries for every platform and ships them to the
# public SesameH/unirt-sdk repo: syncs wrapper source (Python/Android/iOS
# bindings + the frozen unirt.h header) and attaches native libraries as a
# GitHub Release, all tagged to match. unirt-sdk never sees this repo's
# sdk/, plugins/, or third-party/ sources.
on:
  push:
    tags: ['v*']

env:
  UNIRT_SDK_REPO: SesameH/unirt-sdk

jobs:
  build-macos-ios:
    name: Build macOS (Python) + iOS XCFramework
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-macos-arm64
      - name: Build + install macOS native libs
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF &&
          cmake --build build -j4 &&
          cmake --install build --prefix sdk/pkg-unirt
      - name: Package macOS native libs (unirt/lib/ layout the Python binding expects)
        run: |
          mkdir -p publish
          tar -C sdk/pkg-unirt -czf publish/unirt-python-native-macos-arm64.tar.gz lib
      - name: Build UniRT.xcframework
        run: >
          cmake -S bindings/ios/framework -B build-ios-framework-sim -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-sim -j4 &&
          cmake -S bindings/ios/framework -B build-ios-framework-device -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-device -j4 &&
          xcodebuild -create-xcframework
          -library build-ios-framework-device/libunirt_ios.dylib
          -library build-ios-framework-sim/libunirt_ios.dylib
          -output publish/UniRT.xcframework
      - name: Zip XCFramework
        run: (cd publish && zip -r -y unirt-ios-xcframework.zip UniRT.xcframework)
      - uses: actions/upload-artifact@v4
        with:
          name: publish-macos-ios
          path: |
            publish/unirt-python-native-macos-arm64.tar.gz
            publish/unirt-ios-xcframework.zip
          retention-days: 7

  build-android:
    name: Build Android native libs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-android-arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR (bundles every native lib per ABI)
        run: ./gradlew assembleRelease --console=plain
        working-directory: bindings/android
      - name: Extract prebuilt libs (everything except libunirt_jni.so, which unirt-sdk rebuilds from source)
        run: |
          mkdir -p publish/arm64-v8a
          AAR=$(find bindings/android/build/outputs/aar -name "*.aar")
          unzip -o -j "$AAR" "jni/arm64-v8a/*" -d publish/arm64-v8a
          rm -f publish/arm64-v8a/libunirt_jni.so
          tar -C publish -czf unirt-android-native-arm64-v8a.tar.gz arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: publish-android
          path: unirt-android-native-arm64-v8a.tar.gz
          retention-days: 7

  publish:
    name: Sync wrapper source + release on unirt-sdk
    needs: [build-macos-ios, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: publish-macos-ios
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: publish-android
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIRT_SDK_REPO }}
          token: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
          path: unirt-sdk
      - name: Sync wrapper source (bindings only — sdk/plugins/third-party never leave this repo)
        run: |
          set -e
          rsync -a --delete --exclude unirt/lib --exclude LICENSE --exclude README.md \
            core/bindings/python/ unirt-sdk/python/
          rsync -a --delete core/bindings/android/kotlin/ unirt-sdk/android/kotlin/
          rsync -a --delete core/bindings/android/test/ unirt-sdk/android/test/
          cp core/bindings/android/jni/unirt_jni.cpp unirt-sdk/android/jni/unirt_jni.cpp
          rsync -a --delete core/bindings/ios/Sources/UniRTKit/ unirt-sdk/ios/Sources/UniRTKit/
          rsync -a --delete core/bindings/ios/Tests/ unirt-sdk/ios/Tests/
          cp core/sdk/include/unirt.h unirt-sdk/include/unirt.h
          cp core/sdk/include/unirt.h unirt-sdk/ios/Sources/CUniRT/unirt.h
      - name: Commit source sync
        run: |
          cd unirt-sdk
          git config user.name "unirt-sdk-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync wrapper source from core ${{ github.ref_name }}"
          git push
      - name: Create GitHub Release on unirt-sdk
        env:
          GH_TOKEN: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ env.UNIRT_SDK_REPO }}" \
            --title "${{ github.ref_name }}" \
            --notes "Prebuilt native libraries for UniRT ${{ github.ref_name }}. See README.md for install instructions per platform." \
            artifacts/unirt-python-native-macos-arm64.tar.gz \
            artifacts/unirt-android-native-arm64-v8a.tar.gz \
            artifacts/unirt-ios-xcframework.zip
