name: Publish SDK

# Builds prebuilt native libraries for every platform and ships them to the
# public SesameH/unirt-sdk repo: syncs wrapper source (Python/Android/iOS
# bindings + the frozen unirt.h header) and attaches native libraries as a
# GitHub Release, all tagged to match. unirt-sdk never sees this repo's
# sdk/, plugins/, or third-party/ sources.
on:
  push:
    tags: ['v*']

env:
  UNIRT_SDK_REPO: SesameH/unirt-sdk
  GGUF_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf

jobs:
  build-macos-ios:
    name: Build macOS (Python) + iOS XCFramework
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-macos-arm64
      - name: Build + install macOS native libs
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF &&
          cmake --build build -j4 &&
          cmake --install build --prefix sdk/pkg-unirt
      - name: Package macOS native libs (unirt/lib/ layout the Python binding expects)
        run: |
          mkdir -p publish
          tar -C sdk/pkg-unirt -czf publish/unirt-python-native-macos-arm64.tar.gz lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build + smoke-test macOS arm64 wheel
        run: |
          set -e
          python3 -m pip install --quiet build wheel
          python3 bindings/python/build_wheel.py \
            --native-prefix sdk/pkg-unirt \
            --version "${GITHUB_REF_NAME#v}" \
            --platform-tag macosx_14_0_arm64 \
            --output-dir publish
          python3 -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps publish/*.whl
          wheel-smoke/bin/python bindings/python/smoke_installed_wheel.py
      - name: Build UniRT.xcframework
        run: >
          cmake -S bindings/ios/framework -B build-ios-framework-sim -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-sim -j4 &&
          cmake -S bindings/ios/framework -B build-ios-framework-device -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-device -j4 &&
          xcodebuild -create-xcframework
          -library build-ios-framework-device/libunirt_ios.dylib
          -library build-ios-framework-sim/libunirt_ios.dylib
          -output publish/UniRT.xcframework
      - name: Zip XCFramework
        run: (cd publish && zip -r -y unirt-ios-xcframework.zip UniRT.xcframework)
      - uses: actions/upload-artifact@v4
        with:
          name: publish-macos-ios
          path: |
            publish/unirt-python-native-macos-arm64.tar.gz
            publish/unirt-ios-xcframework.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-macos-arm64
          path: publish/*.whl
          retention-days: 7

  build-python-linux:
    name: Python wheel (${{ matrix.platform_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            arch: x86_64
            platform_tag: manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            arch: aarch64
            platform_tag: manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Select manylinux Python + install build tools
        run: |
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
          /opt/python/cp312-cp312/bin/python -m pip install --quiet \
            auditwheel build cmake ninja wheel
      - name: Build + install native runtime
        run: |
          cmake -S sdk -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIRT_PLUGIN_MLX=OFF \
            -DUNIRT_PLUGIN_ONNXRUNTIME=OFF \
            -DUNIRT_NATIVE_TESTS=OFF \
            -DUNIRT_PYTHON_TESTS=OFF
          cmake --build build -j4
          cmake --install build --prefix sdk/pkg-unirt
      - name: Build + audit + smoke-test wheel
        run: |
          set -e
          python bindings/python/build_wheel.py \
            --native-prefix sdk/pkg-unirt \
            --version "${GITHUB_REF_NAME#v}" \
            --platform-tag "${{ matrix.platform_tag }}" \
            --output-dir publish
          auditwheel show publish/*.whl
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps publish/*.whl
          wheel-smoke/bin/python bindings/python/smoke_installed_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-linux-${{ matrix.arch }}
          path: publish/*.whl
          retention-days: 7

  build-python-windows:
    name: Python wheel (${{ matrix.platform_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            platform_tag: win_amd64
            cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - runner: windows-11-arm
            arch: arm64
            platform_tag: win_arm64
            cmake_flags: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=../third-party/llama.cpp/cmake/arm64-windows-llvm.cmake
              "-DCMAKE_C_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
              "-DCMAKE_CXX_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: MSVC environment (x64)
        if: matrix.arch == 'x64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja + LLVM (arm64)
        if: matrix.arch == 'arm64'
        run: |
          choco install ninja llvm -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tools
        run: python -m pip install --quiet build delvewheel wheel
      - name: Build + install native runtime
        run: >
          cmake -S sdk -B build ${{ matrix.cmake_flags }}
          -DUNIRT_PLUGIN_MLX=OFF
          -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DUNIRT_NATIVE_TESTS=OFF
          -DUNIRT_PYTHON_TESTS=OFF
          &&
          cmake --build build --config Release -j 4
          &&
          cmake --install build --config Release --prefix sdk/pkg-unirt
      - name: Build + inspect + smoke-test wheel
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python bindings/python/build_wheel.py `
            --native-prefix sdk/pkg-unirt `
            --version $version `
            --platform-tag "${{ matrix.platform_tag }}" `
            --output-dir publish
          $wheel = Get-ChildItem publish\*.whl | Select-Object -First 1
          python -m delvewheel show $wheel.FullName
          python -m venv wheel-smoke
          & wheel-smoke\Scripts\python -m pip install --no-deps $wheel.FullName
          & wheel-smoke\Scripts\python bindings/python/smoke_installed_wheel.py
      - name: Run inference from the installed wheel
        # Loading the plugin proves the packaging; only decoding proves the
        # binary itself runs on Windows, which cross-compilation cannot.
        run: |
          & wheel-smoke\Scripts\python -m pip install --quiet huggingface_hub
          Invoke-WebRequest -Uri $env:GGUF_URL -OutFile smoke-model.gguf
          & wheel-smoke\Scripts\python bindings/python/smoke_inference_wheel.py smoke-model.gguf
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-windows-${{ matrix.arch }}
          path: publish/*.whl
          retention-days: 7

  build-android:
    name: Build Android native libs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-android-arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR (bundles every native lib per ABI)
        run: ./gradlew assembleRelease --console=plain
        working-directory: bindings/android
      - name: Extract prebuilt libs (everything except libunirt_jni.so, which unirt-sdk rebuilds from source)
        run: |
          mkdir -p publish/arm64-v8a
          AAR=$(find bindings/android/build/outputs/aar -name "*.aar")
          unzip -o -j "$AAR" "jni/arm64-v8a/*" -d publish/arm64-v8a
          rm -f publish/arm64-v8a/libunirt_jni.so
          tar -C publish -czf unirt-android-native-arm64-v8a.tar.gz arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: publish-android
          path: unirt-android-native-arm64-v8a.tar.gz
          retention-days: 7

  publish:
    name: Sync wrapper source + release on unirt-sdk
    needs:
      [build-macos-ios, build-python-linux, build-python-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: publish-macos-ios
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: publish-android
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: publish-wheel-*
          path: wheels
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIRT_SDK_REPO }}
          token: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
          path: unirt-sdk
      - name: Sync wrapper source (bindings only — sdk/plugins/third-party never leave this repo)
        run: |
          set -e
          rsync -a --delete --exclude unirt/lib --exclude LICENSE --exclude README.md \
            core/bindings/python/ unirt-sdk/python/
          rsync -a --delete core/bindings/android/kotlin/ unirt-sdk/android/kotlin/
          rsync -a --delete core/bindings/android/test/ unirt-sdk/android/test/
          cp core/bindings/android/jni/unirt_jni.cpp unirt-sdk/android/jni/unirt_jni.cpp
          rsync -a --delete core/bindings/ios/Sources/UniRTKit/ unirt-sdk/ios/Sources/UniRTKit/
          rsync -a --delete core/bindings/ios/Tests/ unirt-sdk/ios/Tests/
          cp core/sdk/include/unirt.h unirt-sdk/include/unirt.h
          cp core/sdk/include/unirt.h unirt-sdk/ios/Sources/CUniRT/unirt.h
          mkdir -p unirt-sdk/examples
          cp core/examples/chat.html unirt-sdk/examples/chat.html
          rsync -a --delete \
            --exclude '*.gguf' --exclude '*.xcodeproj' \
            --exclude 'UniRTChatExample/Info.plist' --exclude '.swiftpm' \
            core/examples/ios/UniRTChatExample/ unirt-sdk/examples/ios/UniRTChatExample/
          # unirt-sdk's Swift package lives at ios/, not bindings/ios/
          sed -i 's#path: \.\./\.\./\.\./bindings/ios#path: ../../../ios#' \
            unirt-sdk/examples/ios/UniRTChatExample/project.yml
          rsync -a --delete \
            --exclude '*.gguf' --exclude 'build' --exclude '.gradle' \
            --exclude '.cxx' --exclude '.kotlin' --exclude 'local.properties' \
            core/examples/android/UniRTChatExample/ unirt-sdk/examples/android/UniRTChatExample/
          # unirt-sdk's Android library module lives at android/, not bindings/android/
          sed -i 's#bindings/android/build/outputs#android/build/outputs#' \
            unirt-sdk/examples/android/UniRTChatExample/app/build.gradle.kts
          sed -i 's|cd bindings/android && ./gradlew assembleRelease && cd -|cd android \&\& ./gradlew assembleRelease \&\& cd -   # needs prebuilt/<abi>/*.so, see android/README.md|' \
            unirt-sdk/examples/android/UniRTChatExample/README.md
      - name: Commit source sync
        run: |
          cd unirt-sdk
          git config user.name "unirt-sdk-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync wrapper source from core ${{ github.ref_name }}"
          git push
      - name: Assemble the real Android AAR (not raw .so files — see android/README.md)
        run: |
          set -e
          mkdir -p unirt-sdk/android/prebuilt/arm64-v8a
          tar -C unirt-sdk/android/prebuilt/arm64-v8a -xzf artifacts/unirt-android-native-arm64-v8a.tar.gz --strip-components=1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR
        run: ./gradlew assembleRelease --console=plain
        working-directory: unirt-sdk/android
      - name: Locate release assets
        run: |
          set -e
          mkdir -p release-assets
          cp "$(find unirt-sdk/android/build/outputs/aar -name '*.aar')" release-assets/unirt-android.aar
          cp artifacts/unirt-python-native-macos-arm64.tar.gz release-assets/
          cp artifacts/unirt-ios-xcframework.zip release-assets/
          cp wheels/*.whl release-assets/
      - name: Create GitHub Release on unirt-sdk
        env:
          GH_TOKEN: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ env.UNIRT_SDK_REPO }}" \
            --title "${{ github.ref_name }}" \
            --notes "Prebuilt native libraries for UniRT ${{ github.ref_name }}. See README.md for install instructions per platform." \
            release-assets/unirt-python-native-macos-arm64.tar.gz \
            release-assets/unirt-android.aar \
            release-assets/unirt-ios-xcframework.zip \
            release-assets/*.whl

  publish-pypi:
    name: Publish wheel to PyPI
    # Gated behind a repo variable so the workflow stays green until PyPI
    # trusted publishing is configured (pypi.org -> project unirt -> add
    # publisher: SesameH/Edge-AI, workflow publish-sdk.yml). Then set the
    # repository variable PYPI_PUBLISH=true.
    if: vars.PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: publish-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
