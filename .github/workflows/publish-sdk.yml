name: Publish SDK

# Builds prebuilt native libraries for every platform and ships them to the
# public SesameH/unirt-sdk repo: syncs wrapper source (Python/Android/iOS
# bindings + the frozen unirt.h header) and attaches native libraries as a
# GitHub Release, all tagged to match. unirt-sdk never sees this repo's
# sdk/, plugins/, or third-party/ sources.
on:
  push:
    tags: ['v*']
  # A dry run: builds and smoke-tests every platform exactly as a tag would,
  # and stops before the two jobs that publish anything. The wiring in here is
  # otherwise only ever exercised by cutting a release, which is a bad moment
  # to find out that a build flag does not survive the manylinux toolchain.
  workflow_dispatch:

env:
  UNIRT_SDK_REPO: SesameH/unirt-sdk
  ORT_VERSION: 1.26.0
  # The macOS the wheels promise, in both the platform tag and the binaries.
  # Without it CMAKE_OSX_DEPLOYMENT_TARGET follows the build machine, and the
  # runner image moving to macOS 26 silently made every dylib require 26.4.
  MACOS_DEPLOYMENT_TARGET: '14.0'
  MACOS_PLATFORM_TAG: macosx_14_0_arm64
  GGUF_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf

jobs:
  version:
    name: Resolve the version being built
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Without the "v", which is what a wheel filename and UNIRT_VERSION want.
      number: ${{ steps.pick.outputs.number }}
      # With it: the tag to create on unirt-sdk.
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        # On a tag, the tag. On a dry run there is no version being released,
        # and inventing one that looks real is how a dry-run wheel ends up
        # somewhere it should not be -- so it is plainly 0.0.0.dev0.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # 0.0.0, not 0.0.0.dev0: build_wheel.py takes X.Y.Z only, and the
            # dry run has to go through exactly the same packaging path as a
            # release or it is not testing it. Nobody mistakes 0.0.0 for one.
            echo "number=0.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=v0.0.0" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build-macos-ios:
    name: Build macOS (Python) + iOS XCFramework
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-macos-arm64
      - name: Fetch MLX submodule
        run: git submodule update --init --depth 1 third-party/mlx
      - name: Cache the MLX static library
        id: mlx-cache
        uses: actions/cache@v4
        with:
          path: build-mlx/install
          # Keyed on the pinned submodule commit: MLX only needs rebuilding
          # when that moves, and the build is the slowest step in this job.
          key: mlx-jit-${{ runner.os }}-${{ env.MACOS_DEPLOYMENT_TARGET }}-${{ hashFiles('.git/modules/third-party/mlx/HEAD') }}
      - name: Build MLX
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        run: >
          cmake -S third-party/mlx -B build-mlx -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOS_DEPLOYMENT_TARGET }}
          -DMLX_METAL_JIT=ON
          -DMLX_BUILD_TESTS=OFF -DMLX_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_INSTALL_PREFIX="$PWD/build-mlx/install" &&
          cmake --build build-mlx -j4 &&
          cmake --install build-mlx
      - name: Fetch the ONNX Runtime SDK
        run: |
          mkdir -p build-onnxruntime
          curl -fsSL -o build-onnxruntime/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
          tar -xzf build-onnxruntime/ort.tgz -C build-onnxruntime
      - name: Build + install macOS native libs
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOS_DEPLOYMENT_TARGET }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_VERSION=${{ needs.version.outputs.number }}
          -DUNIRT_ONNXRUNTIME_ROOT="$PWD/build-onnxruntime/onnxruntime-osx-arm64-${ORT_VERSION}" &&
          cmake --build build -j4 &&
          cmake --install build --prefix sdk/pkg-unirt
      - name: Every runtime this wheel promises must be in it
        run: |
          set -e
          for runtime in llama_cpp mlx onnxruntime; do
            test -f "sdk/pkg-unirt/lib/$runtime/libunirt_plugin.dylib" \
              || { echo "::error::$runtime plugin missing from the install prefix"; exit 1; }
          done
          # Without its metallib beside it, the MLX plugin loads and then finds
          # no Metal device -- a failure with no error attached to it.
          test -f sdk/pkg-unirt/lib/mlx/mlx.metallib \
            || { echo "::error::mlx.metallib missing; the MLX backend would find no device"; exit 1; }
      - name: Package macOS native libs (unirt/lib/ layout the Python binding expects)
        run: |
          mkdir -p publish
          tar -C sdk/pkg-unirt -czf publish/unirt-python-native-macos-arm64.tar.gz lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build + smoke-test macOS arm64 wheel
        run: |
          set -e
          python3 -m pip install --quiet build wheel
          python3 bindings/python/build_wheel.py \
            --native-prefix sdk/pkg-unirt \
            --version "${{ needs.version.outputs.number }}" \
            --platform-tag "${MACOS_PLATFORM_TAG}" \
            --output-dir publish
          # The tag names a minimum macOS; nothing else checks the binaries
          # keep that promise, and the default deployment target does not.
          python3 tools/ci/check_macos_deployment_target.py publish/*.whl
          python3 -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps publish/*.whl
          wheel-smoke/bin/python bindings/python/smoke_installed_wheel.py
      - name: Build UniRT.xcframework
        run: >
          cmake -S bindings/ios/framework -B build-ios-framework-sim -DCMAKE_BUILD_TYPE=Release
          -DUNIRT_VERSION=${{ needs.version.outputs.number }}
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-sim -j4 &&
          cmake -S bindings/ios/framework -B build-ios-framework-device -DCMAKE_BUILD_TYPE=Release
          -DUNIRT_VERSION=${{ needs.version.outputs.number }}
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-device -j4 &&
          xcodebuild -create-xcframework
          -library build-ios-framework-device/libunirt_ios.dylib
          -library build-ios-framework-sim/libunirt_ios.dylib
          -output publish/UniRT.xcframework
      - name: Zip XCFramework
        run: (cd publish && zip -r -y unirt-ios-xcframework.zip UniRT.xcframework)
      - uses: actions/upload-artifact@v4
        with:
          name: publish-macos-ios
          path: |
            publish/unirt-python-native-macos-arm64.tar.gz
            publish/unirt-ios-xcframework.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-macos-arm64
          path: publish/*.whl
          retention-days: 7

  build-python-linux:
    name: Python wheel (${{ matrix.platform_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            arch: x86_64
            platform_tag: manylinux_2_31_x86_64
            ort_arch: linux-x64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            arch: aarch64
            platform_tag: manylinux_2_31_aarch64
            ort_arch: linux-aarch64
    needs: version
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    # Building glslc (cached), then all of ggml-vulkan's shader translation
    # units, then the CPU backend once per instruction-set level -- with no
    # ccache in this job at all.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace (container job)
        # Only the manylinux jobs run in a container, where the checkout's uid
        # and the shell's uid differ and git refuses the repository outright:
        # "fatal: detected dubious ownership". The workspace is created by the
        # runner for this job, so trusting it adds nothing an attacker could use.
        run: git config --global --add safe.directory '*'
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Select manylinux Python + install build tools
        run: |
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
          /opt/python/cp312-cp312/bin/python -m pip install --quiet \
            auditwheel build cmake ninja wheel
      - name: Cache the Vulkan shader toolchain
        id: vulkan-toolchain
        uses: actions/cache@v4
        with:
          path: vulkan-toolchain
          # Keyed on the script, which is where the pinned shaderc tag lives.
          key: vulkan-toolchain-${{ matrix.arch }}-${{ hashFiles('tools/ci/setup_vulkan_manylinux.sh') }}
      - name: Vulkan shader toolchain
        # AlmaLinux 8 has the Vulkan headers and loader but no shaderc at all,
        # so glslc gets built here. See the script for why that is unavoidable.
        run: tools/ci/setup_vulkan_manylinux.sh vulkan-toolchain
      - name: Fetch the ONNX Runtime SDK
        run: |
          mkdir -p build-onnxruntime
          curl -fsSL -o build-onnxruntime/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${{ matrix.ort_arch }}-${ORT_VERSION}.tgz"
          tar -xzf build-onnxruntime/ort.tgz -C build-onnxruntime
      - name: Build + install native runtime
        run: |
          cmake -S sdk -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIRT_VERSION="${{ needs.version.outputs.number }}" \
            -DUNIRT_PLUGIN_MLX=OFF \
            -DUNIRT_LLAMA_VULKAN=ON \
            -DUNIRT_LLAMA_CPU_VARIANTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/vulkan-toolchain" \
            -DVulkan_GLSLC_EXECUTABLE="$PWD/vulkan-toolchain/bin/glslc" \
            -DUNIRT_ONNXRUNTIME_ROOT="$PWD/build-onnxruntime/onnxruntime-${{ matrix.ort_arch }}-${ORT_VERSION}" \
            -DUNIRT_NATIVE_TESTS=OFF \
            -DUNIRT_PYTHON_TESTS=OFF
          cmake --build build -j4
          cmake --install build --prefix sdk/pkg-unirt
          # MLX is Apple-only, so Linux ships two runtimes and both must be here.
          for runtime in llama_cpp onnxruntime; do
            test -f "sdk/pkg-unirt/lib/$runtime/libunirt_plugin.so" \
              || { echo "::error::$runtime plugin missing from the install prefix"; exit 1; }
          done
          # This build makes every ggml backend a separate loadable module.
          # Losing the CPU ones leaves a wheel with no backend at all; losing
          # the Vulkan one silently downgrades every GPU machine to CPU.
          # Neither shows up as a build failure.
          test -f sdk/pkg-unirt/lib/llama_cpp/libggml-vulkan.so \
            || { echo "::error::ggml vulkan backend module missing from the install prefix"; exit 1; }
          # With UNIRT_LLAMA_CPU_VARIANTS the CPU backend is not one file but
          # one per instruction-set level, named for the level rather than
          # "cpu" -- so count them instead, and refuse a build that quietly
          # fell back to a single baseline backend for every machine.
          variants=$(ls sdk/pkg-unirt/lib/llama_cpp/libggml-cpu-*.so 2>/dev/null | wc -l)
          if [ "$variants" -lt 2 ]; then
            echo "::error::found $variants CPU backend variants; CPU dispatch did not get built"
            exit 1
          fi
          echo "$variants CPU backend variants installed"
          ls sdk/pkg-unirt/lib/llama_cpp/libggml-cpu-*.so
      - name: The plugin itself must not depend on the Vulkan loader
        # Why the backends are modules at all: libvulkan.so.1 exists only where
        # a Vulkan driver is installed. A plugin that names it as a hard
        # dependency fails to dlopen on a slim container or a driverless server
        # and takes CPU inference with it -- the same shape as the OpenSSL
        # dependency that shipped in 0.2.2. Only libggml-vulkan.so may need it.
        run: |
          set -e
          for library in libunirt_plugin.so libggml.so; do
            if readelf -d "sdk/pkg-unirt/lib/llama_cpp/$library" | grep -q libvulkan; then
              echo "::error::$library links the Vulkan loader; CPU-only machines would lose the plugin"
              exit 1
            fi
          done
          if ! readelf -d sdk/pkg-unirt/lib/llama_cpp/libggml-vulkan.so | grep libvulkan; then
            echo "::error::libggml-vulkan.so does not name the Vulkan loader, so it cannot be a Vulkan build"
            exit 1
          fi
      - name: Build + audit + smoke-test wheel
        run: |
          set -e
          python bindings/python/build_wheel.py \
            --native-prefix sdk/pkg-unirt \
            --version "${{ needs.version.outputs.number }}" \
            --platform-tag "${{ matrix.platform_tag }}" \
            --output-dir publish
          # The platform tag is stamped by hand above, so nothing so far has
          # checked that the binary earns it. See the script for why the tag
          # auditwheel calls the wheel "consistent with" is the wrong question
          # here and the glibc floor is the right one.
          python tools/ci/check_manylinux_tag.py publish/*.whl "${{ matrix.platform_tag }}"
          # No smoke test here: bundling ONNX Runtime puts the wheel's glibc
          # floor at 2.31, above this image's 2.28, so pip in this container
          # correctly refuses to install what was just built. smoke-linux runs
          # it on glibc 2.31 exactly -- the floor the tag claims, which is a
          # stricter place to test than any newer distro.
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-linux-${{ matrix.arch }}
          path: publish/*.whl
          retention-days: 7

  smoke-linux:
    name: Inference from the ${{ matrix.arch }} wheel (glibc 2.31)
    needs: build-python-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      # Debian 11 is glibc 2.31 on the nose: the oldest system the wheels claim
      # to support, so a missing symbol shows up here rather than at a user's.
      # The python: variant of it because bullseye's own python3 is 3.9, below
      # this package's floor -- pip there fails with "requires a different
      # Python" before it ever looks at the binaries.
      image: python:3.12-slim-bullseye
    timeout-minutes: 30
    steps:
      # debian:11 ships no git, so checkout falls back to a REST tarball --
      # which is all this needs: the smoke script, and no submodules.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publish-wheel-linux-${{ matrix.arch }}
          path: wheel
      - name: Show the environment under test
        run: |
          apt-get update -qq
          apt-get install -y -qq curl >/dev/null
          python3 --version
          ldd --version | head -1
      - name: Fetch the test model
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install the wheel and run inference
        run: |
          set -e
          python3 -m venv smoke
          smoke/bin/python -m pip install --quiet --upgrade pip
          smoke/bin/python -m pip install --quiet wheel/*.whl
          smoke/bin/unirt devices
          smoke/bin/python bindings/python/smoke_inference_wheel.py \
            models/SmolLM2-135M-Instruct-Q8_0.gguf
      - name: The CPU backend that loads must be built for this machine
        # The wheel has to run on every CPU of its architecture, so its
        # baseline backend has no AVX2 at all. Shipping the variants is half
        # the feature; this checks the other half -- that the loaded one is
        # not the baseline.
        run: |
          smoke/bin/python bindings/python/smoke_cpu_variant_wheel.py
      - name: A machine with no Vulkan driver must lose only Vulkan
        # bullseye-slim has no Vulkan loader, which makes it the exact
        # environment the loadable-module layout exists for: libggml-vulkan.so
        # cannot load, and everything else has to carry on. The inference above
        # already ran, so this only has to confirm the reason it could.
        run: |
          set -e
          if ldconfig -p | grep -q libvulkan; then
            echo "::error::this image has a Vulkan loader, so it no longer tests the missing-loader path"
            exit 1
          fi
          if smoke/bin/unirt devices | grep -qi vulkan; then
            echo "::error::a Vulkan device appeared on a machine with no Vulkan loader"
            exit 1
          fi
          echo "no Vulkan loader, no Vulkan device, CPU inference unaffected"

  smoke-linux-vulkan:
    name: Inference on a Vulkan device (${{ matrix.arch }})
    needs: build-python-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # ggml-vulkan will not choose a PHYSICAL_DEVICE_TYPE_CPU device for
      # itself -- rightly, a software rasterizer loses to the CPU backend --
      # so lavapipe has to be named. That makes this a test of the plumbing:
      # the module ships in the wheel, loads, enumerates a device, and runs a
      # forward pass on a Vulkan queue. Which GPU a user gets is ggml's
      # decision and independent of all of it.
      GGML_VK_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publish-wheel-linux-${{ matrix.arch }}
          path: wheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|deviceType' || true
      - name: Fetch the test model
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install the wheel and decode on Vulkan
        run: |
          set -e
          python3 -m venv smoke
          smoke/bin/python -m pip install --quiet --upgrade pip
          smoke/bin/python -m pip install --quiet wheel/*.whl
          smoke/bin/python bindings/python/smoke_vulkan_wheel.py \
            models/SmolLM2-135M-Instruct-Q8_0.gguf

  build-python-windows:
    name: Python wheel (${{ matrix.platform_tag }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            platform_tag: win_amd64
            ort_arch: win-x64
            # One CPU backend per instruction-set level. Not on win_arm64
            # below: ggml defines no ARM-on-Windows variant set, and that
            # build already targets armv8.7-a explicitly.
            cpu_variants: 'ON'
            cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - runner: windows-11-arm
            arch: arm64
            platform_tag: win_arm64
            ort_arch: win-arm64
            cpu_variants: 'OFF'
            cmake_flags: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=../third-party/llama.cpp/cmake/arm64-windows-llvm.cmake
              "-DCMAKE_C_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
              "-DCMAKE_CXX_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: MSVC environment (x64)
        if: matrix.arch == 'x64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja + LLVM (arm64)
        if: matrix.arch == 'arm64'
        run: |
          choco install ninja llvm -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build tools
        run: python -m pip install --quiet build delvewheel wheel
      - name: Fetch the ONNX Runtime SDK
        run: |
          New-Item -ItemType Directory -Force -Path build-onnxruntime | Out-Null
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-${{ matrix.ort_arch }}-$env:ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile build-onnxruntime/ort.zip
          Expand-Archive -Path build-onnxruntime/ort.zip -DestinationPath build-onnxruntime -Force
      - name: Build + install native runtime
        run: >
          cmake -S sdk -B build ${{ matrix.cmake_flags }}
          -DUNIRT_VERSION=${{ needs.version.outputs.number }}
          -DUNIRT_PLUGIN_MLX=OFF
          -DUNIRT_LLAMA_CPU_VARIANTS=${{ matrix.cpu_variants }}
          -DUNIRT_ONNXRUNTIME_ROOT="${{ github.workspace }}/build-onnxruntime/onnxruntime-${{ matrix.ort_arch }}-${{ env.ORT_VERSION }}"
          -DUNIRT_NATIVE_TESTS=OFF
          -DUNIRT_PYTHON_TESTS=OFF
          &&
          cmake --build build --config Release -j 4
          &&
          cmake --install build --config Release --prefix sdk/pkg-unirt
      - name: Build + inspect + smoke-test wheel
        run: |
          $version = "${{ needs.version.outputs.number }}"
          python bindings/python/build_wheel.py `
            --native-prefix sdk/pkg-unirt `
            --version $version `
            --platform-tag "${{ matrix.platform_tag }}" `
            --output-dir publish
          $wheel = Get-ChildItem publish\*.whl | Select-Object -First 1
          python -m delvewheel show $wheel.FullName
          python -m venv wheel-smoke
          & wheel-smoke\Scripts\python -m pip install --no-deps $wheel.FullName
          & wheel-smoke\Scripts\python bindings/python/smoke_installed_wheel.py
      - name: Run inference from the installed wheel
        # Loading the plugin proves the packaging; only decoding proves the
        # binary itself runs on Windows, which cross-compilation cannot.
        run: |
          # Every declared dependency, not just huggingface_hub: `import unirt`
          # reaches tokenizers through modeling.py, so a partial install dies
          # before decoding starts and the step proves nothing.
          & wheel-smoke\Scripts\python -m pip install --quiet huggingface_hub tokenizers tqdm
          Invoke-WebRequest -Uri $env:GGUF_URL -OutFile smoke-model.gguf
          & wheel-smoke\Scripts\python bindings/python/smoke_inference_wheel.py smoke-model.gguf
      - name: The CPU backend that loads must be built for this machine
        if: matrix.arch == 'x64'
        run: |
          & wheel-smoke\Scripts\python bindings/python/smoke_cpu_variant_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: publish-wheel-windows-${{ matrix.arch }}
          path: publish/*.whl
          retention-days: 7

  build-android:
    name: Build Android native libs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-android-arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR (bundles every native lib per ABI)
        run: ./gradlew assembleRelease --console=plain
        working-directory: bindings/android
      - name: Extract prebuilt libs (everything except libunirt_jni.so, which unirt-sdk rebuilds from source)
        run: |
          mkdir -p publish/arm64-v8a
          AAR=$(find bindings/android/build/outputs/aar -name "*.aar")
          unzip -o -j "$AAR" "jni/arm64-v8a/*" -d publish/arm64-v8a
          rm -f publish/arm64-v8a/libunirt_jni.so
          tar -C publish -czf unirt-android-native-arm64-v8a.tar.gz arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: publish-android
          path: unirt-android-native-arm64-v8a.tar.gz
          retention-days: 7

  publish:
    name: Sync wrapper source + release on unirt-sdk
    # Never on a dry run: everything above it builds and is smoke-tested, and
    # then nothing leaves this repository. A dispatch that could still push to
    # unirt-sdk or PyPI would not be a dry run.
    if: github.event_name == 'push'
    needs:
      [version, build-macos-ios, build-python-linux, build-python-windows,
       build-android, smoke-linux, smoke-linux-vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/download-artifact@v4
        with:
          name: publish-macos-ios
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: publish-android
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: publish-wheel-*
          path: wheels
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIRT_SDK_REPO }}
          token: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
          path: unirt-sdk
      - name: Sync wrapper source (bindings only — sdk/plugins/third-party never leave this repo)
        run: |
          set -e
          rsync -a --delete --exclude unirt/lib --exclude LICENSE \
            core/bindings/python/ unirt-sdk/python/
          rsync -a --delete core/bindings/android/kotlin/ unirt-sdk/android/kotlin/
          rsync -a --delete core/bindings/android/test/ unirt-sdk/android/test/
          cp core/bindings/android/jni/unirt_jni.cpp unirt-sdk/android/jni/unirt_jni.cpp
          rsync -a --delete core/bindings/ios/Sources/UniRTKit/ unirt-sdk/ios/Sources/UniRTKit/
          rsync -a --delete core/bindings/ios/Tests/ unirt-sdk/ios/Tests/
          cp core/sdk/include/unirt.h unirt-sdk/include/unirt.h
          cp core/sdk/include/unirt.h unirt-sdk/ios/Sources/CUniRT/unirt.h
          mkdir -p unirt-sdk/examples
          cp core/examples/chat.html unirt-sdk/examples/chat.html
          rsync -a --delete \
            --exclude '*.gguf' --exclude '*.xcodeproj' \
            --exclude 'UniRTChatExample/Info.plist' --exclude '.swiftpm' \
            core/examples/ios/UniRTChatExample/ unirt-sdk/examples/ios/UniRTChatExample/
          # unirt-sdk's Swift package lives at ios/, not bindings/ios/
          sed -i 's#path: \.\./\.\./\.\./bindings/ios#path: ../../../ios#' \
            unirt-sdk/examples/ios/UniRTChatExample/project.yml
          rsync -a --delete \
            --exclude '*.gguf' --exclude 'build' --exclude '.gradle' \
            --exclude '.cxx' --exclude '.kotlin' --exclude 'local.properties' \
            core/examples/android/UniRTChatExample/ unirt-sdk/examples/android/UniRTChatExample/
          # unirt-sdk's Android library module lives at android/, not bindings/android/
          sed -i 's#bindings/android/build/outputs#android/build/outputs#' \
            unirt-sdk/examples/android/UniRTChatExample/app/build.gradle.kts
          sed -i 's|cd bindings/android && ./gradlew assembleRelease && cd -|cd android \&\& ./gradlew assembleRelease \&\& cd -   # needs prebuilt/<abi>/*.so, see android/README.md|' \
            unirt-sdk/examples/android/UniRTChatExample/README.md
      - name: Commit source sync
        run: |
          cd unirt-sdk
          git config user.name "unirt-sdk-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync wrapper source from core ${{ needs.version.outputs.tag }}"
          git push
      - name: Assemble the real Android AAR (not raw .so files — see android/README.md)
        run: |
          set -e
          mkdir -p unirt-sdk/android/prebuilt/arm64-v8a
          tar -C unirt-sdk/android/prebuilt/arm64-v8a -xzf artifacts/unirt-android-native-arm64-v8a.tar.gz --strip-components=1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR
        run: ./gradlew assembleRelease --console=plain
        working-directory: unirt-sdk/android
      - name: Locate release assets
        run: |
          set -e
          mkdir -p release-assets
          cp "$(find unirt-sdk/android/build/outputs/aar -name '*.aar')" release-assets/unirt-android.aar
          cp artifacts/unirt-python-native-macos-arm64.tar.gz release-assets/
          cp artifacts/unirt-ios-xcframework.zip release-assets/
          cp wheels/*.whl release-assets/
      - name: Create GitHub Release on unirt-sdk
        env:
          GH_TOKEN: ${{ secrets.UNIRT_SDK_PUSH_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ env.UNIRT_SDK_REPO }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes "Prebuilt native libraries for UniRT ${{ needs.version.outputs.tag }}. See README.md for install instructions per platform." \
            release-assets/unirt-python-native-macos-arm64.tar.gz \
            release-assets/unirt-android.aar \
            release-assets/unirt-ios-xcframework.zip \
            release-assets/*.whl

  publish-pypi:
    name: Publish wheel to PyPI
    # Gated behind a repo variable so the workflow stays green until PyPI
    # trusted publishing is configured (pypi.org -> project unirt -> add
    # publisher: SesameH/Edge-AI, workflow publish-sdk.yml). Then set the
    # repository variable PYPI_PUBLISH=true.
    if: github.event_name == 'push' && vars.PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: publish-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
