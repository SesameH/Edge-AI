name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# A newer push supersedes any run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GGUF_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf

jobs:
  macos:
    name: macOS arm64 (llama_cpp)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64
      - name: Configure
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Install
        run: cmake --install build --prefix sdk/pkg-unirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Run tests
        run: python -m pytest tests/python -q

  linux:
    name: Linux x64 (llama_cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x64
      - name: Configure
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Install
        run: cmake --install build --prefix sdk/pkg-unirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Native tests
        run: >
          ctest --test-dir build --output-on-failure
          -R "unirt-(static-registration|inference-smoke)"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Run tests
        run: python -m pytest tests/python -q

  android:
    name: Android arm64-v8a (build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-v8a
      - name: Configure (NDK cross-compile, JNI binding included)
        run: >
          cmake -S bindings/android/jni -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build-android -j4
      - name: Verify outputs
        run: |
          ls -la build-android/libunirt_jni.so build-android/plugins/libunirt_plugin_llama_cpp.so
          find build-android -name "libunirt.so" | head -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR and run Kotlin unit tests
        run: ./gradlew assembleRelease testReleaseUnitTest --console=plain
        working-directory: bindings/android
      - name: Verify the AAR bundled every native library
        run: |
          AAR=$(find bindings/android/build/outputs/aar -name "*.aar")
          unzip -l "$AAR" | grep -E "jni/arm64-v8a/lib(unirt|unirt_jni|unirt_plugin_llama_cpp|llama|mtmd|ggml|ggml-cpu|ggml-base|omp)\.so"

  ios:
    name: iOS arm64 (simulator tests)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-sim-arm64
      - name: Configure (static libraries; plugins register in-process)
        run: >
          cmake -S sdk -B build-ios -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DUNIRT_BUILD_SHARED=OFF -DBUILD_SHARED_LIBS=OFF
          -DGGML_METAL=OFF
          -DUNIRT_PYTHON_TESTS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build-ios -j4
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(next(dev['udid'] for devices in data['devices'].values()
                     for dev in devices if dev['isAvailable']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b   # wait until launchd_sim is ready
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run native tests inside the simulator
        run: |
          ls -la build-ios/unirt-*-test
          file build-ios/unirt-inference-smoke-test
          codesign -s - -f build-ios/unirt-static-registration-test build-ios/unirt-inference-smoke-test
          xcrun simctl spawn "$SIM_UDID" "$PWD/build-ios/unirt-static-registration-test"
          xcrun simctl spawn "$SIM_UDID" "$PWD/build-ios/unirt-inference-smoke-test" \
            "$PWD/models/SmolLM2-135M-Instruct-Q8_0.gguf"
      - name: Build UniRT.xcframework (merges libunirt + plugin + llama.cpp into one dylib per slice)
        run: >
          cmake -S bindings/ios/framework -B build-ios-framework-sim -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-sim -j4 &&
          cmake -S bindings/ios/framework -B build-ios-framework-device -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-device -j4 &&
          rm -rf bindings/ios/UniRT.xcframework &&
          xcodebuild -create-xcframework
          -library build-ios-framework-device/libunirt_ios.dylib
          -library build-ios-framework-sim/libunirt_ios.dylib
          -output bindings/ios/UniRT.xcframework
      - name: Build & run Swift binding (UniRTKit) against the real plugin
        run: |
          export TEST_RUNNER_UNIRT_TEST_MODEL_PATH="$GITHUB_WORKSPACE/models/SmolLM2-135M-Instruct-Q8_0.gguf"
          xcodebuild test -scheme UniRTKit -destination "id=$SIM_UDID"
        working-directory: bindings/ios

  windows:
    name: ${{ matrix.label }} (llama_cpp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            # Ninja + MSVC from msvc-dev-cmd: the VS generator cannot use a
            # compiler launcher, and ccache is most of the speedup here.
            cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - os: windows-11-arm
            label: Windows arm64
            # llama.cpp refuses MSVC on ARM; use its clang toolchain file,
            # the same recipe as llama.cpp's own Windows ARM64 releases.
            # Relative CMAKE_TOOLCHAIN_FILE resolves against the build dir;
            # ../ lands on the repo root. (github.workspace is empty inside
            # matrix values, and pwsh does not expand $env: in -D tokens.)
            # The explicit --target overrides clang's default triple: choco
            # may install an x64 LLVM whose default is x86_64, which compiled
            # the generic ggml sources for the wrong arch (duplicate symbols
            # against the arm-specific sources at link time).
            # Overriding CMAKE_<LANG>_FLAGS replaces the toolchain's
            # *_FLAGS_INIT, so restate its -march too: without it the build
            # falls back to baseline armv8.0 and inference crawls (no
            # dotprod/fp16 kernels).
            cmake_flags: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=../third-party/llama.cpp/cmake/arm64-windows-llvm.cmake
              "-DCMAKE_C_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
              "-DCMAKE_CXX_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
      - name: MSVC environment (x64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install ninja + LLVM (arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          choco install ninja llvm -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"
      - name: Toolchain diagnostics (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          which clang ninja
          clang --version
          echo 'int main(void){return 0;}' > probe.c
          clang -v -c probe.c -o probe.obj 2>&1 | grep -i -m1 target || true
      - name: Configure
        run: >
          cmake -S sdk -B build ${{ matrix.cmake_flags }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Install
        run: cmake --install build --config Release --prefix sdk/pkg-unirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Run tests
        run: python -m pytest tests/python -q
