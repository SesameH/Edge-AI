name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  # Manual trigger: re-running a docs-only or otherwise skipped commit, and
  # checking the runners are actually available, should not need a fake push.
  workflow_dispatch:

# A newer push supersedes any run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GGUF_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf

jobs:
  python-floor:
    # Literal, not ${{ env.PYTHON_FLOOR }}: the env context is not available in
    # a job's `name`, so the interpolation would render as an empty string.
    name: Python 3.10 syntax floor
    # Every other job runs 3.12, where `f'{",\n".join(x)}'` is legal. It is a
    # SyntaxError on 3.10 and 3.11, which pyproject.toml still promises to
    # support, so `import unirt` was broken there with nothing to catch it.
    # Parsing the package under the oldest supported interpreter is enough --
    # this is about grammar, not behaviour, so it needs no native build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHON_FLOOR: '3.10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_FLOOR }}
      - name: Check the declared floor matches pyproject
        run: |
          declared=$(sed -n 's/^requires-python = ">=\(.*\)"/\1/p' bindings/python/pyproject.toml)
          echo "pyproject requires-python >= $declared; this job runs $PYTHON_FLOOR"
          test "$declared" = "$PYTHON_FLOOR"
      - name: Compile every module
        run: python -m compileall -q bindings/python/unirt

  macos:
    name: macOS arm64 (llama_cpp)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64
      - name: Configure
        # GGML_METAL=OFF: the macOS runners are virtualised, and every model
        # load recompiles the Metal shader library on them. Identical suite,
        # 10s on Linux and Windows against 29m35s here. What that measures is
        # the runner's paravirtualised GPU, not Metal on real hardware -- which
        # is exercised locally on every dev machine -- so CI covers the CPU
        # path and stops holding the whole pipeline at half an hour.
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DGGML_METAL=OFF
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Install
        run: cmake --install build --prefix sdk/pkg-unirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Run tests
        run: python -m pytest tests/python -q

  linux:
    name: Linux x64 (llama_cpp + Vulkan)
    runs-on: ubuntu-latest
    # ggml-vulkan is ~420 shader translation units plus one very large
    # ggml-vulkan.cpp; a cold ccache takes most of an hour on 4 cores, a warm
    # one takes minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x64-vulkan
      - name: Vulkan toolchain and a software driver to run on
        # 24.04 packages headers new enough for current ggml-vulkan, so this is
        # the cheap place to compile the backend -- the release job has to build
        # its own glslc inside manylinux. lavapipe is Mesa's software Vulkan
        # implementation: a real Vulkan device on a runner with no GPU.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev spirv-headers \
            mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|deviceType' || true
      - name: Configure
        run: >
          cmake -S sdk -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DUNIRT_LLAMA_VULKAN=ON
      - name: Build
        run: cmake --build build -j4
      - name: Install
        run: cmake --install build --prefix sdk/pkg-unirt
      - name: The plugin itself must not depend on the Vulkan loader
        # The reason the ggml backends are separate loadable modules: a machine
        # with no Vulkan driver has no libvulkan.so.1, and a plugin that needs
        # one there fails to dlopen and takes CPU inference down with it. Only
        # libggml-vulkan.so may name it, and that module is skipped when it
        # cannot load.
        run: |
          set -e
          for library in libunirt_plugin.so libggml.so; do
            if readelf -d "sdk/pkg-unirt/lib/llama_cpp/$library" | grep -q libvulkan; then
              echo "::error::$library links the Vulkan loader; CPU-only machines would lose the plugin"
              exit 1
            fi
          done
          if ! readelf -d sdk/pkg-unirt/lib/llama_cpp/libggml-vulkan.so | grep libvulkan; then
            echo "::error::libggml-vulkan.so does not name the Vulkan loader, so it cannot be a Vulkan build"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Native tests
        run: >
          ctest --test-dir build --output-on-failure
          -R "unirt-(static-registration|inference-smoke)"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Run tests
        run: python -m pytest tests/python -q
      - name: Decode on the Vulkan device
        # ggml-vulkan refuses PHYSICAL_DEVICE_TYPE_CPU devices when it picks for
        # itself -- correct, since a software rasterizer loses to the CPU
        # backend -- so lavapipe has to be named explicitly. What this proves is
        # the plumbing: the module ships, loads, enumerates, and a real forward
        # pass runs on a Vulkan queue. Which physical device a user gets is
        # ggml's choice, and unrelated to any of that.
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
        run: python bindings/python/smoke_vulkan_wheel.py models/SmolLM2-135M-Instruct-Q8_0.gguf

  android:
    name: Android arm64-v8a (build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-v8a
      - name: Configure (NDK cross-compile, JNI binding included)
        run: >
          cmake -S bindings/android/jni -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build-android -j4
      - name: Verify outputs
        run: |
          ls -la build-android/libunirt_jni.so build-android/plugins/libunirt_plugin_llama_cpp.so
          find build-android -name "libunirt.so" | head -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the AAR and run Kotlin unit tests
        run: ./gradlew assembleRelease testReleaseUnitTest --console=plain
        working-directory: bindings/android
      - name: Verify the AAR bundled every native library
        run: |
          AAR=$(find bindings/android/build/outputs/aar -name "*.aar")
          unzip -l "$AAR" | grep -E "jni/arm64-v8a/lib(unirt|unirt_jni|unirt_plugin_llama_cpp|llama|mtmd|ggml|ggml-cpu|ggml-base|omp)\.so"

  ios:
    name: iOS arm64 (simulator tests)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-sim-arm64
      - name: Start booting a simulator
        # simctl boot returns as soon as the request is queued, so the boot --
        # around two minutes of it -- overlaps the build rather than following
        # it. bootstatus below is where the job actually waits.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(next(dev['udid'] for devices in data['devices'].values()
                     for dev in devices if dev['isAvailable']))")
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Configure (static libraries; plugins register in-process)
        run: >
          cmake -S sdk -B build-ios -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DUNIRT_BUILD_SHARED=OFF -DBUILD_SHARED_LIBS=OFF
          -DGGML_METAL=OFF
          -DUNIRT_PYTHON_TESTS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build-ios -j4
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIM_UDID" -b   # until launchd_sim is ready
      - name: Run native tests inside the simulator
        run: |
          ls -la build-ios/unirt-*-test
          file build-ios/unirt-inference-smoke-test
          codesign -s - -f build-ios/unirt-static-registration-test build-ios/unirt-inference-smoke-test
          xcrun simctl spawn "$SIM_UDID" "$PWD/build-ios/unirt-static-registration-test"
          xcrun simctl spawn "$SIM_UDID" "$PWD/build-ios/unirt-inference-smoke-test" \
            "$PWD/models/SmolLM2-135M-Instruct-Q8_0.gguf"
      - name: Build UniRT.xcframework (simulator slice; publish-sdk.yml ships both)
        # Everything below runs in the simulator, so the iphoneos slice was
        # compiled and never loaded -- about half this step for nothing. What
        # ships to devices is unchanged; a device-only compile break now
        # surfaces at release instead of here.
        run: >
          cmake -S bindings/ios/framework -B build-ios-framework-sim -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DGGML_METAL=OFF -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache &&
          cmake --build build-ios-framework-sim -j4 &&
          rm -rf bindings/ios/UniRT.xcframework &&
          xcodebuild -create-xcframework
          -library build-ios-framework-sim/libunirt_ios.dylib
          -output bindings/ios/UniRT.xcframework
      - name: Build & run Swift binding (UniRTKit) against the real plugin
        run: |
          export TEST_RUNNER_UNIRT_TEST_MODEL_PATH="$GITHUB_WORKSPACE/models/SmolLM2-135M-Instruct-Q8_0.gguf"
          xcodebuild test -scheme UniRTKit -destination "id=$SIM_UDID"
        working-directory: bindings/ios

  windows:
    # The release wheels are cross-compiled and only ever checked for "the
    # plugin loads"; path handling, UTF-8 console output and the DLL search
    # order are exactly what a cross-build cannot vouch for, so the behaviour
    # suite runs on real Windows here — on both architectures.
    name: ${{ matrix.label }} (llama_cpp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            # Ninja + MSVC from msvc-dev-cmd: the VS generator cannot use a
            # compiler launcher, and ccache is most of the speedup here.
            cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - os: windows-11-arm
            label: Windows arm64
            # llama.cpp refuses MSVC on ARM; use its clang toolchain file,
            # the same recipe as llama.cpp's own Windows ARM64 releases.
            # Relative CMAKE_TOOLCHAIN_FILE resolves against the build dir;
            # ../ lands on the repo root. (github.workspace is empty inside
            # matrix values, and pwsh does not expand $env: in -D tokens.)
            # The explicit --target overrides clang's default triple: choco
            # may install an x64 LLVM whose default is x86_64, which compiled
            # the generic ggml sources for the wrong arch (duplicate symbols
            # against the arm-specific sources at link time).
            # Overriding CMAKE_<LANG>_FLAGS replaces the toolchain's
            # *_FLAGS_INIT, so restate its -march too: without it the build
            # falls back to baseline armv8.0 and inference crawls (no
            # dotprod/fp16 kernels).
            cmake_flags: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=../third-party/llama.cpp/cmake/arm64-windows-llvm.cmake
              "-DCMAKE_C_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
              "-DCMAKE_CXX_FLAGS=--target=arm64-pc-windows-msvc -march=armv8.7-a"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp submodule
        run: git submodule update --init --depth 1 third-party/llama.cpp
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
      - name: MSVC environment (x64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install ninja + LLVM (arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          choco install ninja llvm -y
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"
      - name: Toolchain diagnostics (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          which clang ninja
          clang --version
          echo 'int main(void){return 0;}' > probe.c
          clang -v -c probe.c -o probe.obj 2>&1 | grep -i -m1 target || true
      - name: Configure
        run: >
          cmake -S sdk -B build ${{ matrix.cmake_flags }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUNIRT_PLUGIN_MLX=OFF -DUNIRT_PLUGIN_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Install
        run: cmake --install build --config Release --prefix sdk/pkg-unirt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/SmolLM2-135M-Instruct-Q8_0.gguf
          key: smollm2-135m-q8_0
      - name: Download test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fL -o models/SmolLM2-135M-Instruct-Q8_0.gguf "$GGUF_URL"
      - name: Install Python binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bindings/python pytest
      - name: Plugin load diagnostics
        # LoadLibraryExW returns 126 (ERROR_MOD_NOT_FOUND) for the plugin: one
        # of its dependencies, possibly a nested one, is unresolvable under the
        # loader's search flags. Load each installed library on its own to find
        # which, and print every import so the missing name is visible instead
        # of inferred.
        continue-on-error: true
        shell: pwsh
        run: |
          python -c "import logging, unirt._ffi._api as a; logging.basicConfig(level=logging.DEBUG); a.set_log_level('trace'); a.init(); print('runtimes:', a.get_runtime_list())"
          python tools/ci/windows_dll_report.py sdk/pkg-unirt/lib
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            foreach ($dll in Get-ChildItem -Recurse -Filter *.dll sdk/pkg-unirt/lib) {
              Write-Host "=== imports of $($dll.Name)"
              & dumpbin /DEPENDENTS $dll.FullName | Select-String -Pattern '\.dll$'
            }
          }
      - name: Run tests
        run: python -m pytest tests/python -q
